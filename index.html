<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Sederhana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #33018a 35% , #ad52f3 50%);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(248, 248, 248, 0.3);
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            background: #667eea;
            color: white;
            font-size: 14px;
            padding: 2px 12px;
            border-radius: 20px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .input-area button:hover {
            transform: scale(1.05);
        }

        /* Daftar tugas */
        #taskList {
            list-style: none;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 8px;
            animation: masuk 0.3s ease;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: #e9ecef;
        }

        /* Animasi masuk */
        @keyframes masuk {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animasi keluar (saat dihapus) - INI YANG DIMINTA */
        @keyframes keluar {
            0% {
                opacity: 1;
                transform: scale(1);
                max-height: 100px;
                margin-bottom: 8px;
                padding: 12px 16px;
            }
            100% {
                opacity: 0;
                transform: scale(0.8) translateX(50px);
                max-height: 0;
                margin-bottom: 0;
                padding: 0 16px;
                overflow: hidden;
            }
        }

        .task-item.hapus {
            animation: keluar 0.4s ease forwards;
            pointer-events: none;
        }

        .task-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .task-item .teks {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .task-item .teks.selesai {
            text-decoration: line-through;
            color: #999;
        }

        .task-item .tombol-hapus {
            background: #ff6b6b;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .task-item .tombol-hapus:hover {
            background: #ee5a24;
            transform: rotate(90deg);
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 14px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .footer button {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 14px;
        }

        .footer button:hover {
            text-decoration: underline;
        }

        /* Kosong */
        .kosong {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            Daftar tugas kamu nihh 👀
            <span id="jumlah">0</span>
        </h1>

        <div class="input-area">
            <input type="text" id="inputTugas" placeholder="Haiii ada tugas apa..??">
            <button id="tombolTambah">Tambah</button>
        </div>

        <ul id="taskList">
            <li class="kosong">🤷🏻❓ Belum ada tugas nih</li>
        </ul>

        <div class="footer">
            <span id="sisa">0 tersisa</span>
            <button id="hapusSemua">🗑️ Hapus Semua</button>
        </div>
    </div>

    <script>
        // Ambil data dari penyimpanan
        let tugas = JSON.parse(localStorage.getItem('tugas')) || [];

        // Ambil elemen HTML
        const inputTugas = document.getElementById('inputTugas');
        const tombolTambah = document.getElementById('tombolTambah');
        const taskList = document.getElementById('taskList');
        const jumlahSpan = document.getElementById('jumlah');
        const sisaSpan = document.getElementById('sisa');
        const hapusSemuaBtn = document.getElementById('hapusSemua');

        // Tampilkan semua tugas
        function tampilkanTugas() {
            taskList.innerHTML = '';

            if (tugas.length === 0) {
                taskList.innerHTML = '<li class="kosong">✨ Jangan seneng dulu belum ada tugas nihh >< </li>';
            } else {
                tugas.forEach((t, index) => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.dataset.index = index;

                    // Checkbox
                    const cek = document.createElement('input');
                    cek.type = 'checkbox';
                    cek.checked = t.selesai;
                    cek.onchange = () => toggleSelesai(index);

                    // Teks
                    const span = document.createElement('span');
                    span.className = 'teks' + (t.selesai ? ' selesai' : '');
                    span.textContent = t.teks;

                    // Tombol hapus
                    const btn = document.createElement('button');
                    btn.className = 'tombol-hapus';
                    btn.innerHTML = '✕';
                    btn.onclick = () => hapusTugas(index, li);

                    li.appendChild(cek);
                    li.appendChild(span);
                    li.appendChild(btn);
                    taskList.appendChild(li);
                });
            }

            // Update jumlah
            jumlahSpan.textContent = tugas.length;
            const sisa = tugas.filter(t => !t.selesai).length;
            sisaSpan.textContent = sisa + ' tersisa';
        }

        // Tambah tugas
        function tambahTugas() {
            const teks = inputTugas.value.trim();
            if (teks === '') {
                inputTugas.style.borderColor = '#ff6b6b';
                setTimeout(() => inputTugas.style.borderColor = '#e0e0e0', 500);
                return;
            }

            tugas.push({ teks, selesai: false });
            localStorage.setItem('tugas', JSON.stringify(tugas));
            inputTugas.value = '';
            inputTugas.focus();
            tampilkanTugas();
        }

        // Toggle selesai
        function toggleSelesai(index) {
            tugas[index].selesai = !tugas[index].selesai;
            localStorage.setItem('tugas', JSON.stringify(tugas));
            tampilkanTugas();
        }

        // Hapus tugas dengan ANIMASI
        function hapusTugas(index, elemen) {
            // Kasih animasi keluar
            elemen.classList.add('hapus');

            // Tunggu animasi selesai (0.4 detik), baru hapus dari array
            setTimeout(() => {
                tugas.splice(index, 1);
                localStorage.setItem('tugas', JSON.stringify(tugas));
                tampilkanTugas();
            }, 400);
        }

        // Hapus semua
        function hapusSemua() {
            if (tugas.length === 0) return;
            if (confirm('Udah selesai nih tugasnya?')) {
                // Kasih animasi ke semua
                const items = document.querySelectorAll('.task-item');
                items.forEach((item, i) => {
                    setTimeout(() => item.classList.add('hapus'), i * 50);
                });

                // Tunggu semua animasi selesai
                setTimeout(() => {
                    tugas = [];
                    localStorage.setItem('tugas', JSON.stringify(tugas));
                    tampilkanTugas();
                }, items.length * 50 + 400);
            }
        }

        // Event listener
        tombolTambah.addEventListener('click', tambahTugas);
        inputTugas.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') tambahTugas();
        });
        hapusSemuaBtn.addEventListener('click', hapusSemua);

        // Jalankan pertama kali
        tampilkanTugas();
    </script>

</body>
</html>
